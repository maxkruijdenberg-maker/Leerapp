name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-desktop:
    name: Windows desktop check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npx --no install-electron
      - run: npm run test:desktop
  bundle:
    name: Build and upload complete Windows bundle
    needs: windows-desktop
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install and validate
        run: |
          set -euo pipefail
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          npm ci
          npm test
          npm run test:ui
      - name: Build bundle
        run: |
          set +e
          npm run bundle:win 2>&1 | tee "$RUNNER_TEMP/bundle-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            node -e 'const fs=require("node:fs");const text=fs.readFileSync(process.argv[1],"utf8").trim().split(/\r?\n/).slice(-50).join("\n").replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error title=Windows bundle build::"+text)' "$RUNNER_TEMP/bundle-build.log"
          fi
          exit "$build_status"
      - name: Check packaged Windows app
        run: SMOKE_EXECUTABLE="dist/win-unpacked/Makelaar Academie.exe" npm run test:desktop
      - name: Upload to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          gh release upload "$tag" "dist/Makelaar-Academie-$version-Windows-x64.zip" "dist/Makelaar-Academie-$version-Windows-x64.sha256" --repo "$GITHUB_REPOSITORY"
