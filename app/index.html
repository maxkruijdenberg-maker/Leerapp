<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' academy: data:; media-src academy:; frame-src academy:; object-src 'none'; connect-src 'none'"
    />
    <title>Makelaar Academie</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="titlebar" id="titlebar">
      <span class="window-title"
        >MAKELAAR ACADEMIE <span>·</span> JOUW STUDEERKAMER</span
      >
      <div class="window-controls" aria-label="Vensterbediening">
        <button
          data-action="window"
          data-command="minimize"
          aria-label="Minimaliseren"
          title="Minimaliseren"
        >
          −
        </button>
        <button
          id="window-fullscreen"
          data-action="window"
          data-command="toggleFullscreen"
          aria-label="Venstermodus"
          title="Venstermodus · Esc"
        >
          ▣
        </button>
        <button
          class="window-close"
          data-action="window"
          data-command="close"
          aria-label="App sluiten"
          title="App sluiten"
        >
          ×
        </button>
      </div>
    </div>
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-icon">M<span>⌂</span></span>
        <div>Makelaar<span>ACADEMIE</span></div>
      </div>
      <nav id="nav" aria-label="Hoofdnavigatie"></nav>
      <div class="module-heading">
        <span class="side-label">MIJN MODULES</span
        ><button
          data-action="newModule"
          class="icon-button"
          aria-label="Module toevoegen"
          title="Module toevoegen"
        >
          ＋
        </button>
      </div>
      <nav id="modules" aria-label="Modules"></nav>
      <div class="side-bottom">
        <span class="online-dot"></span> Je studie, op jouw computer.<small
          >Offline & persoonlijk <span>V0.3.1</span></small
        >
      </div>
    </aside>
    <div class="shell">
      <header class="app-header">
        <div id="breadcrumb">Mijn studeerkamer</div>
        <div class="header-actions">
          <span class="local-label">LOKAAL BEWAARD</span
          ><button data-action="import" class="ghost small">
            ↑ Lespakket importeren
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="dialog-title"></dialog>
    <script src="renderer.js"></script>
  </body>
</html>
